[tool.poetry]
name = "nischallllll-github-io"
version = "0.3.0"
description = "Markdown-first academic site with a small Jinja static build."
authors = ["Nischal Bhandari"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
jinja2 = "^3.1.4"
pyyaml = "^6.0.2"
markdown = "^3.7"

[tool.poetry.group.dev.dependencies]
ruff = "^0.6.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff.lint]
preview = true
select = ['E', 'F', 'W', 'I']
ignore = ["E501"]
